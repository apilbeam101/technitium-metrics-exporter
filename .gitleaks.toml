title = "technitium-metrics-exporter gitleaks config"

# No other project-specific rules or allowlist entries yet. Add exceptions
# here only once a real false positive is observed — do not preemptively
# allowlist a path such as test/fixtures/, since that is exactly where a real
# secret accidentally pasted into a hand-authored fixture would otherwise go
# undetected.
[extend]
useDefault = true

[[allowlists]]
description = "Self-signed/CA-signed keys generated solely to exercise TLS/mTLS wiring in tests — never valid for, or used against, a real host"
paths = [
  '''test/support/tls/localhost-key\.pem''',
  '''test/support/tls/ca-key\.pem''',
  '''test/support/tls/client-key\.pem''',
  '''test/support/tls/untrusted-client-key\.pem''',
]

[[allowlists]]
description = "Synthetic hex placeholder used only to exercise the token-shaped-string branch of scripts/sanitize-fixtures.ts's own leak detector — not a real credential. Scoped to its one source file (condition = \"and\") so the literal isn't allowlisted repo-wide."
paths = [
  '''test/unit/scripts/sanitize-fixtures\.test\.ts''',
]
regexes = [
  '''abcdef0123456789abcdef0123456789abcdef''',
]
condition = "and"
