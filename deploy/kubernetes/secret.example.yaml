# Example only — do not apply as-is. Generate the real Secret from the API
# token(s) created per DESIGN.md §6.4, e.g.:
#   kubectl create secret generic technitium-metrics-exporter-secrets \
#     --from-literal=TECHNITIUM_API_TOKEN=<token> \
#     --from-literal=TECHNITIUM_API_TOKEN__DNS_A=<per-target token, if used>
apiVersion: v1
kind: Secret
metadata:
  name: technitium-metrics-exporter-secrets
  labels:
    app.kubernetes.io/name: technitium-metrics-exporter
type: Opaque
stringData:
  TECHNITIUM_API_TOKEN: "replace-with-a-real-token"
