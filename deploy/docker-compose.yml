services:
  technitium-metrics-exporter:
    # Pinned to a specific tagged release rather than :latest, so re-running
    # `docker compose pull` on an existing deployment can't silently change
    # what's running. Building from source instead: replace this with
    # `build: ..` (see docs/INSTALL_DOCKER.md's "build it yourself" path).
    image: ghcr.io/apilbeam101/technitium-metrics-exporter:0.1.0
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      # Update this if METRICS_PORT in .env is changed from the default:
      # Compose's own `${VAR}` interpolation reads a .env file next to this
      # compose file (deploy/.env), not the env_file: entry above (../.env),
      # so it cannot be kept in lockstep automatically here.
      - "10153:10153"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No explicit healthcheck block here: Compose falls back to the image's
    # own Dockerfile HEALTHCHECK, so there's one definition to keep in sync
    # rather than two.
